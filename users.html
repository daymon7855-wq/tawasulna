<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المستخدمون - تواصلنا</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
    margin:30px auto;
}

.back-btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    margin-bottom:20px;
}

.users-box{
    background:white;
    padding:20px;
    border-radius:15px;
}

.user-card{

    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;

}

.user-card:hover{

    background:#eef4ff;

}


.user-image{

    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;

}


.user-avatar{

    width:60px;
    height:60px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;

}


.user-name{

    font-size:18px;
    font-weight:bold;

}


.user-email{

    color:#777;
    font-size:14px;

}


.empty{

    text-align:center;
    color:#777;
    padding:30px;

}

</style>

</head>


<body>


<header>

<h1>👥 المستخدمون</h1>

</header>



<div class="container">


<a class="back-btn" href="index.html">
← العودة للرئيسية
</a>



<div class="users-box">


<div id="usersList">

<div class="empty">
جارٍ تحميل المستخدمين...
</div>

</div>


</div>


</div>




<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getFirestore,
collection,
onSnapshot

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




const firebaseConfig = {

apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

authDomain: "tawasuulna.firebaseapp.com",

projectId: "tawasuulna",

storageBucket: "tawasuulna.firebasestorage.app",

messagingSenderId: "310730975553",

appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



const usersList =
document.getElementById("usersList");



let currentUser;



onAuthStateChanged(auth,(user)=>{


if(!user){

location.href="login.html";

return;

}


currentUser=user;


loadUsers();


});





function loadUsers(){


onSnapshot(

collection(db,"users"),

(snapshot)=>{


usersList.innerHTML="";



snapshot.forEach((userDoc)=>{


if(userDoc.id === currentUser.uid){

return;

}



const data =
userDoc.data();



const card =
document.createElement("div");


card.className =
"user-card";



if(data.photoURL){


const img =
document.createElement("img");


img.className =
"user-image";


img.src =
data.photoURL;


card.appendChild(img);



}

else{


const avatar =
document.createElement("div");


avatar.className =
"user-avatar";


avatar.textContent =
(data.name || "م").charAt(0);



card.appendChild(avatar);


}





const info =
document.createElement("div");



const name =
document.createElement("div");


name.className =
"user-name";


name.textContent =
data.name || "مستخدم";



const email =
document.createElement("div");


email.className =
"user-email";


email.textContent =
data.email || "";



info.appendChild(name);

info.appendChild(email);


card.appendChild(info);





card.onclick = ()=>{


window.location.href =
"user-profile.html?id=" + userDoc.id;


};




usersList.appendChild(card);



});



},


(error)=>{


console.error(error);


usersList.innerHTML =
'<div class="empty">حدث خطأ أثناء تحميل المستخدمين.</div>';


}


);


}



</script>


</body>

</html>
