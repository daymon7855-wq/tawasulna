<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الرسائل - تواصلنا</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    color: #111;
}

header {
    background: #2563eb;
    color: white;
    padding: 18px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 30px auto;
}

.back-btn {
    display: inline-block;
    padding: 12px 18px;
    margin-bottom: 20px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 10px;
}

.messages-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
}

.users-box,
.chat-box {
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    overflow: hidden;
}

.box-title {
    margin: 0;
    padding: 18px;
    border-bottom: 1px solid #eee;
}

.user-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.user-item:hover,
.user-item.active {
    background: #eef4ff;
}

.user-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.user-avatar-letter {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
}

.user-name {
    font-weight: bold;
}

.user-email {
    font-size: 12px;
    color: #777;
    margin-top: 4px;
}

#chatHeader {
    padding: 18px;
    border-bottom: 1px solid #eee;
    font-weight: bold;
}

#messagesList {
    height: 420px;
    overflow-y: auto;
    padding: 15px;
    background: #f8fafc;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 14px;
    line-height: 1.6;
    word-break: break-word;
}

.my-message {
    background: #2563eb;
    color: white;
    margin-right: auto;
}

.other-message {
    background: white;
    color: #111;
    margin-left: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.message-time {
    font-size: 11px;
    margin-top: 5px;
    opacity: 0.75;
}

.message-form {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #eee;
}

#messageInput {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}

#sendBtn {
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px 15px;
}

@media (max-width: 700px) {

    .messages-layout {
        grid-template-columns: 1fr;
    }

    #messagesList {
        height: 350px;
    }

}

</style>

</head>

<body>

<header>
    <h1>💬 الرسائل</h1>
</header>

<div class="container">

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

    authDomain: "tawasuulna.firebaseapp.com",

    projectId: "tawasuulna",

    storageBucket: "tawasuulna.firebasestorage.app",

    messagingSenderId: "310730975553",

    appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0",

    measurementId: "G-6V0X5QY0DF"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const usersList =
    document.getElementById("usersList");

const messagesList =
    document.getElementById("messagesList");

const chatHeader =
    document.getElementById("chatHeader");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");


let currentUser = null;

let selectedUser = null;

let unsubscribeMessages = null;


onAuthStateChanged(
    auth,

    (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        loadUsers();

    }

);


function loadUsers() {

    onSnapshot(

        collection(db, "users"),

        (snapshot) => {

            usersList.innerHTML =
                "";


            if (snapshot.empty) {

                usersList.innerHTML =
                    '<div class="empty">لا يوجد مستخدمون حتى الآن.</div>';

                return;

            }


            snapshot.forEach(
                (userDoc) => {

                    const data =
                        userDoc.data();


                    if (
                        userDoc.id ===
                        currentUser.uid
                    ) {

                        return;

                    }


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "user-item";


                    if (
                        data.photoURL
                    ) {

                        const image =
                            document.createElement(
                                "img"
                            );

                        image.className =
                            "user-avatar";

                        image.src =
                            data.photoURL;

                        image.alt =
                            "صورة المستخدم";

                        item.appendChild(
                            image
                        );

                    }

                    else {

                        const avatar =
                            document.createElement(
                                "div"
                            );

                        avatar.className =
                            "user-avatar-letter";


                        const avatarName =
                            data.name ||
                            data.email ||
                            "م";


                        avatar.textContent =
                            avatarName
                                .charAt(0)
                                .toUpperCase();


                        item.appendChild(
                            avatar
                        );

                    }


                    const info =
                        document.createElement(
                            "div"
                        );


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "user-name";

                    name.textContent =
                        data.name ||
                        "مستخدم";


                    const email =
                        document.createElement(
                            "div"
                        );

                    email.className =
                        "user-email";

                    email.textContent =
                        data.email ||
                        "";


                    info.appendChild(name);

                    info.appendChild(email);


                    item.appendChild(info);


                    item.addEventListener(
                        "click",

                        () => {

                            document
                                .querySelectorAll(
                                    ".user-item"
                                )
                                .forEach(
                                    (element) => {

                                        element
                                            .classList
                                            .remove(
                                                "active"
                                            );

                                    }
                                );


                            item
                                .classList
                                .add(
                                    "active"
                                );


                            selectedUser = {

                                uid:
                                    userDoc.id,

                                name:
                                    data.name ||
                                    "مستخدم"

                            };


                            chatHeader.textContent =
                                "💬 المحادثة مع " +
                                selectedUser.name;


                            messageInput.disabled =
                                false;

                            sendBtn.disabled =
                                false;


                            loadMessages();

                        }

                    );


                    usersList.appendChild(
                        item
                    );

                }

            );

        },

        (error) => {

            console.error(error);

            usersList.innerHTML =
                '<div class="empty">حدث خطأ أثناء تحميل المستخدمين.</div>';

        }

    );

}


function loadMessages() {

    if (
        unsubscribeMessages
    ) {

        unsubscribeMessages();

    }


    messagesList.innerHTML =
        '<div class="empty">جارٍ تحميل الرسائل...</div>';


    const messagesQuery =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "conversationId",
                "==",
                getConversationId()
            )

        );


    unsubscribeMessages =
        onSnapshot(

            messagesQuery,

            (snapshot) => {

                messagesList.innerHTML =
                    "";


                const messages =
                    [];


                snapshot.forEach(
                    (messageDoc) => {

                        messages.push(
                            messageDoc.data()
                        );

                    }
                );


                messages.sort(
                    (a, b) => {

                        const aTime =
                            a.createdAt
                                ? a.createdAt.toMillis()
                                : 0;


                        const bTime =
                            b.createdAt
                                ? b.createdAt.toMillis()
                                : 0;


                        return aTime - bTime;

                    }
                );


                if (
                    messages.length === 0
                ) {

                    messagesList.innerHTML =
                        '<div class="empty">لا توجد رسائل بعد. ابدأ المحادثة 👋</div>';

                    return;

                }


                messages.forEach(
                    (data) => {

                        const message =
                            document.createElement(
                                "div"
                            );


                        message.className =
                            "message " +
                            (
                                data.senderId ===
                                currentUser.uid

                                ? "my-message"

                                : "other-message"
                            );


                        const text =
                            document.createElement(
                                "div"
                            );

                        text.textContent =
                            data.text ||
                            "";


                        message.appendChild(
                            text
                        );


                        const time =
                            document.createElement(
                                "div"
                            );

                        time.className =
                            "message-time";


                        if (
                            data.createdAt
                        ) {

                            time.textContent =
                                data.createdAt
                                    .toDate()
                                    .toLocaleString(
                                        "ar-EG"
                                    );

                        }

                        else {

                            time.textContent =
                                "الآن";

                        }


                        message.appendChild(
                            time
                        );


                        messagesList.appendChild(
                            message
                        );

                    }
                );


                messagesList.scrollTop =
                    messagesList.scrollHeight;

            },

            (error) => {

                console.error(error);

                messagesList.innerHTML =
                    '<div class="empty">حدث خطأ أثناء تحميل الرسائل.</div>';

            }

        );

}


function getConversationId() {

    const ids =
        [
            currentUser.uid,
            selectedUser.uid
        ];


    ids.sort();


    return ids.join(
        "_"
    );

}


async function sendMessage() {

    if (
        !currentUser ||
        !selectedUser
    ) {

        return;

    }


    const text =
        messageInput.value.trim();


    if (
        !text
    ) {

        return;

    }


    try {

        sendBtn.disabled =
            true;

        sendBtn.textContent =
            "جارٍ الإرسال...";


        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                conversationId:
                    getConversationId(),

                text:
                    text,

                senderId:
                    currentUser.uid,

                senderName:
                    currentUser.displayName ||
                    currentUser.email.split("@")[0],

                receiverId:
                    selectedUser.uid,

                createdAt:
                    serverTimestamp()

            }

        );


        messageInput.value =
            "";

    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء إرسال الرسالة."
        );

    }

    finally {

        sendBtn.disabled =
            false;

        sendBtn.textContent =
            "إرسال";

    }

}


sendBtn.addEventListener(
    "click",

    sendMessage
);


messageInput.addEventListener(
    "keydown",

    (event) => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>

</html>
