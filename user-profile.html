<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي</title>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header {
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
}

.container {
    width:90%;
    max-width:700px;
    margin:30px auto;
}

.profile-box {
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.profile-image {
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #2563eb;
}

.name {
    font-size:25px;
    font-weight:bold;
    margin:15px;
}

.email {
    color:#777;
}

.stats {
    display:flex;
    justify-content:center;
    gap:25px;
    margin:25px 0;
}

.stat {
    font-size:16px;
}

.stat b {
    display:block;
    font-size:22px;
    color:#2563eb;
}

.button {
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:5px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

.follow {
    background:#16a34a;
}

.friend {
    background:#f59e0b;
}

.back {
    display:inline-block;
    background:#333;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    margin-bottom:15px;
}

</style>

</head>

<body>

<header>
<h1>👤 الملف الشخصي</h1>
</header>

<div class="container">

<a class="back" href="users.html">
← المستخدمون
</a>

<div class="profile-box">

<img id="photo"
class="profile-image"
src=""
style="display:none;">

<div class="name" id="name">
جارٍ التحميل...
</div>

<div class="email" id="email"></div>

<div class="stats">

<div class="stat">
<b id="friendsCount">0</b>
أصدقاء
</div>

<div class="stat">
<b id="followersCount">0</b>
متابعون
</div>

<div class="stat">
<b id="followingCount">0</b>
يتابع
</div>

</div>

<button id="friendBtn" class="button friend">
➕ إضافة صديق
</button>

<button id="followBtn" class="button follow">
👥 متابعة
</button>

</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
deleteDoc,
increment
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey:"AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

authDomain:"tawasuulna.firebaseapp.com",

projectId:"tawasuulna",

storageBucket:"tawasuulna.firebasestorage.app",

messagingSenderId:"310730975553",

appId:"1:310730975553:web:a4d3b08381bd0b22e9d9c0"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);



const params=
new URLSearchParams(
window.location.search
);


const profileId=
params.get("id");



const nameBox=
document.getElementById("name");

const emailBox=
document.getElementById("email");

const photo=
document.getElementById("photo");

const friendBtn=
document.getElementById("friendBtn");

const followBtn=
document.getElementById("followBtn");

const friendsCount=
document.getElementById("friendsCount");

const followersCount=
document.getElementById("followersCount");

const followingCount=
document.getElementById("followingCount");



let currentUser=null;



onAuthStateChanged(
auth,
async(user)=>{


if(!user){

location.href="login.html";
return;

}


currentUser=user;

loadProfile();


});




async function loadProfile(){


const userDoc=
await getDoc(
doc(db,"users",profileId)
);



if(!userDoc.exists()){

nameBox.textContent=
"المستخدم غير موجود";

return;

}



const data=
userDoc.data();



nameBox.textContent=
data.name || "مستخدم";


emailBox.textContent=
data.email || "";



if(data.photoURL){

photo.src=data.photoURL;

photo.style.display="block";

}



friendsCount.textContent=
data.friendsCount || 0;


followersCount.textContent=
data.followersCount || 0;


followingCount.textContent=
data.followingCount || 0;



}



followBtn.onclick=
async()=>{


const ref=
doc(
db,
"users",
profileId,
"followers",
currentUser.uid
);



const check=
await getDoc(ref);



if(check.exists()){


await deleteDoc(ref);


followBtn.textContent=
"👥 متابعة";


}

else{


await setDoc(ref,{

userId:currentUser.uid

});


followBtn.textContent=
"❌ إلغاء المتابعة";


}


};



friendBtn.onclick=
async()=>{


const ref=
doc(
db,
"users",
profileId,
"friends",
currentUser.uid
);



await setDoc(ref,{

userId:currentUser.uid,

createdAt:new Date()

});


friendBtn.textContent=
"✅ تم إرسال طلب صداقة";


};



</script>

</body>

</html>
