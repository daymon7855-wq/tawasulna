<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب - تواصلنا</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 97%;
            padding: 12px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>إنشاء حساب</h1>

        <input type="text" placeholder="اسم المستخدم">

        <input type="email" placeholder="البريد الإلكتروني">

        <input type="password" placeholder="كلمة المرور">

        <button>إنشاء الحساب</button>

        <a href="index.html">العودة إلى الصفحة الرئيسية</a>
    </div>

</body>
</html>
