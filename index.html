<head>
    <meta charset="UTF-8">

    <style>

        body {

<body>

    <header>
        <h1>تواصلنا</h1>

    <div class="container">

        <!-- المستخدم غير مسجل الدخول -->

        <div id="guestArea">

            <h2>مرحبًا بك في تواصلنا 👋</h2>

            </a>

            <a class="button" href="login.html">
                تسجيل الدخول

        </div>


        <!-- المستخدم مسجل الدخول -->

        <div id="userArea">

            <h2>أهلًا بك في تواصلنا 👋</h2>

            <p>
                تم تسجيل دخولك بنجاح.
            </p>

            <p>
                البريد الإلكتروني:
                <span id="userEmail"></span>
            </p>

    <footer>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

            authDomain: "tawasuulna.firebaseapp.com",

            projectId: "tawasuulna",

            messagingSenderId: "310730975553",

            appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0",

            measurementId: "G-6V0X5QY0DF"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const guestArea = document.getElementById("guestArea");

        const userArea = document.getElementById("userArea");

        const userEmail = document.getElementById("userEmail");

        const logoutBtn = document.getElementById("logoutBtn");


        onAuthStateChanged(auth, (user) => {

            if (user) {

                // المستخدم مسجل الدخول

                guestArea.style.display = "none";

                userArea.style.display = "block";

                userEmail.textContent = user.email;

            }

            else {

                // المستخدم غير مسجل الدخول

                guestArea.style.display = "block";

                userArea.style.display = "none";

            }

        });


        logoutBtn.addEventListener("click", async () => {

            try {

                await signOut(auth);

                alert("تم تسجيل الخروج بنجاح");

            }

            catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء تسجيل الخروج");

            }

        });

    </script>
