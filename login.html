<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - تواصلنا</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 350px;
        max-width: 85%;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
        color: #2563eb;
        margin-bottom: 25px;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        width: 97%;
        padding: 12px;
        margin-top: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:disabled {
        background: #93b4f5;
        cursor: not-allowed;
    }

    #message {
        margin-top: 15px;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.7;
    }

    a {
        display: block;
        margin-top: 15px;
        color: #2563eb;
        text-decoration: none;
    }

</style>
```

</head>

<body>

<div class="box">

```
<h1>تسجيل الدخول</h1>


<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
    autocomplete="email"
>


<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    autocomplete="current-password"
>


<button id="loginBtn">
    تسجيل الدخول
</button>


<div id="message"></div>


<a href="signup.html">
    إنشاء حساب جديد
</a>


<a href="index.html">
    العودة إلى الصفحة الرئيسية
</a>
```

</div>

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

    authDomain: "tawasuulna.firebaseapp.com",

    projectId: "tawasuulna",

    storageBucket: "tawasuulna.firebasestorage.app",

    messagingSenderId: "310730975553",

    appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0",

    measurementId: "G-6V0X5QY0DF"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginBtn =
    document.getElementById("loginBtn");


const message =
    document.getElementById("message");


/*
    لو المستخدم بالفعل مسجل دخول
    لا نطلب منه تسجيل الدخول مرة أخرى.
*/

onAuthStateChanged(
    auth,
    (user) => {

        if (user) {

            message.style.color =
                "green";

            message.textContent =
                "أنت مسجل الدخول بالفعل 🎉";

            setTimeout(
                () => {

                    window.location.replace(
                        "index.html"
                    );

                },
                500
            );

        }

    }
);


/*
    تسجيل الدخول
*/

loginBtn.addEventListener(
    "click",
    async () => {


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            message.style.color =
                "red";

            message.textContent =
                "اكتب البريد الإلكتروني وكلمة المرور أولًا.";

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "جارٍ تسجيل الدخول...";


        message.style.color =
            "blue";

        message.textContent =
            "جاري تسجيل الدخول...";


        try {


            /*
                تسجيل الدخول في Firebase
            */

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            /*
                نتأكد أن المستخدم أصبح
                مسجلًا فعلًا.
            */

            if (result.user) {

                message.style.color =
                    "green";

                message.textContent =
                    "تم تسجيل الدخول بنجاح 🎉";


                /*
                    إعادة تحميل الصفحة الرئيسية
                    بدل فتح نسخة قديمة منها.
                */

                setTimeout(
                    () => {

                        window.location.replace(
                            "index.html"
                        );

                    },
                    700
                );

            }


        } catch (error) {


            console.error(
                "Firebase Login Error:",
                error
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "تسجيل الدخول";


            message.style.color =
                "red";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "هذا الحساب غير موجود.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/invalid-api-key"
            ) {

                message.textContent =
                    "مفتاح Firebase غير صحيح.";

            }

            else {

                message.innerHTML =
                    "❌ حدث خطأ أثناء تسجيل الدخول<br>" +
                    "<small>" +
                    error.code +
                    "</small>";

            }

        }

    }
);


</script>

</body>

</html>
