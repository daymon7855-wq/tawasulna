</head>

<body>

<div class="box">

```
<h1>تسجيل الدخول</h1>

<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
>

<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
>

<button id="loginBtn">
    تسجيل الدخول
</button>

<div id="message"></div>

<a href="signup.html">
    إنشاء حساب جديد
</a>

<a href="index.html">
    العودة إلى الصفحة الرئيسية
</a>
```

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEjIJc0",

    authDomain: "tawasuulna.firebaseapp.com",

    projectId: "tawasuulna",

    storageBucket: "tawasuulna.firebasestorage.app",

    messagingSenderId: "310730975553",

    appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0",

    measurementId: "G-6V0X5QY0DF"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


loginBtn.addEventListener("click", async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        message.style.color = "red";

        message.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور أولًا.";

        return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "جارٍ تسجيل الدخول...";

    message.style.color = "blue";

    message.textContent =
        "جاري تسجيل الدخول...";


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        message.style.color = "green";

        message.textContent =
            "تم تسجيل الدخول بنجاح 🎉";


        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 700);


    } catch (error) {

        console.error(
            "Firebase Login Error:",
            error
        );


        loginBtn.disabled = false;

        loginBtn.textContent =
            "تسجيل الدخول";


        message.style.color = "red";

        message.innerHTML =
            "❌ فشل تسجيل الدخول<br>" +
            "<small>كود الخطأ: " +
            error.code +
            "</small>";

    }

});

</script>

</body>

</html>
