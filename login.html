<title>تسجيل الدخول - تواصلنا</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f8;

        justify-content: center;

    .box {

```

</head>

<body>

<div class="box">

```
<h1>تسجيل الدخول</h1>

<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
>

<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
>

<button id="loginBtn">
    تسجيل الدخول
</button>

<div id="message"></div>

<a href="signup.html">
    إنشاء حساب جديد
</a>

<a href="index.html">
    العودة إلى الصفحة الرئيسية
</a>
```

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBLYMnh5lAj7VkJgG_VbZcwq-n7WEeIJc0",

    authDomain: "tawasuulna.firebaseapp.com",

    projectId: "tawasuulna",

    storageBucket: "tawasuulna.firebasestorage.app",

    messagingSenderId: "310730975553",

    appId: "1:310730975553:web:a4d3b08381bd0b22e9d9c0",

    measurementId: "G-6V0X5QY0DF"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const button =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


let loginStarted = false;


/*
   Firebase يتأكد من حالة تسجيل الدخول.
   لو المستخدم سجل الدخول بالفعل،
   نرجعه للصفحة الرئيسية.
*/

onAuthStateChanged(auth, (user) => {

    if (user && loginStarted) {

        message.style.color = "green";

        message.textContent =
            "تم تسجيل الدخول بنجاح 🎉";

        window.location.replace("index.html");

    }

});


button.onclick = async function () {

    const userEmail =
        email.value.trim();

    const userPassword =
        password.value;


    if (
        userEmail === "" ||
        userPassword === ""
    ) {

        message.style.color = "red";

        message.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور أولًا.";

        return;

    }


    try {

        button.disabled = true;

        button.textContent =
            "جارٍ تسجيل الدخول...";

        message.style.color = "blue";

        message.textContent =
            "جاري تسجيل الدخول...";


        loginStarted = true;


        await signInWithEmailAndPassword(
            auth,
            userEmail,
            userPassword
        );


        /*
           onAuthStateChanged هي التي
           ستنقلنا إلى index.html
        */


    } catch (error) {

        console.error(error);

        loginStarted = false;

        button.disabled = false;

        button.textContent =
            "تسجيل الدخول";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message.textContent =
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        } else if (
            error.code ===
            "auth/user-not-found"
        ) {

            message.textContent =
                "هذا الحساب غير موجود.";

        } else if (
            error.code ===
            "auth/wrong-password"
        ) {

            message.textContent =
                "كلمة المرور غير صحيحة.";

        } else {

            message.textContent =
                "حدث خطأ أثناء تسجيل الدخول: " +
                error.code;

        }

        message.style.color = "red";

    }

};

</script>

</body>
